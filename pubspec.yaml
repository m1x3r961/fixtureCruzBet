name: fixture_cruzbet
description: "Fixture y Predicciones del Mundial - CruzBet"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Backend ---
  supabase_flutter: ^2.7.0

  # --- Estado (Riverpod) ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # --- Navegación ---
  go_router: ^14.6.2

  # --- Modelos inmutables ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Config de entorno ---
  flutter_dotenv: ^5.2.1

  # --- HTTP para API-Football ---
  http: ^1.2.2

  # --- UI helpers ---
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Code generation ---
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/flags/
